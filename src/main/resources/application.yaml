spring:
  application:
    name: spring-ai-agent-learning
  ai:
    openai:
      base-url: https://api.openai.com
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

server:
  port: 8080

logging:
  level:
    org.springframework.ai.chat.client.advisor: DEBUG
    org.springframework.ai.vectorstore: TRACE